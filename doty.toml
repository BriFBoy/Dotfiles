# doty project config (run doty from this directory).
# Docs: https://github.com/BriFBoy/doty

[packages]
# What `doty link` does when a real file (not a symlink) is in the way.
# "backup" moves it to name.bak before symlinking — non-destructive.
conflict = "backup"
# `fallback` is left at the default ("once"); it only matters if the OS ID
# doesn't match a [os] table, and ID=fedora matches [fedora] directly.

[bundles]
# Named groups of packages for `doty bundle install <name>`.
hyprland = [
  "hyprland",
  "noctalia",
  "ghostty",
  "bash",
  "fish",
  "starship",
  "yazi",
  "fastfetch",
]
dev = [
  "git",
  "neovim",
  "tmux",
  "mise",
  "opencode",
]
